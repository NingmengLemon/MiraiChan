[project]
name = "lemony_checkers"
version = "0.1.1"
description = "Lemoneko's permission checker library for MiraiChan"
authors = [
    { name = "NingmengLemon", email = "60469383+NingmengLemon@users.noreply.github.com" },
]
dependencies = ["lemony_settings", "melobot>=3.3.0", "pydantic>=2.12.5"]

requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "AGPL3" }

[tool.uv.sources]
lemony_settings = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
