[project]
name = "lemony_network"
version = "0.1.0"
description = "Lemoneko's network utils library for MiraiChan"
authors = [
    { name = "NingmengLemon", email = "60469383+NingmengLemon@users.noreply.github.com" },
]
dependencies = ["aiohttp>=3.10.10", "yarl>=1.22.0"]

requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "AGPL3" }


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
