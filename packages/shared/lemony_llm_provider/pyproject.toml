[project]
name = "lemony_llm_provider"
version = "0.1.0"
description = "Lemoneko's LLM provider library for MiraiChan"
authors = [
    { name = "NingmengLemon", email = "60469383+NingmengLemon@users.noreply.github.com" },
]
dependencies = [
    "anthropic>=1.15.0",
    "google-genai>=2.31.0",
    "httpx2>=2.13.1",
    "lemony-settings",
    "openai>=3.35.1",
    "pydantic>=2.12.5",
]

requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "AGPL3" }

[tool.uv.sources]
lemony-settings = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
