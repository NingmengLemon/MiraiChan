[project]
name = "lemony_onebot_utils"
version = "0.1.0"
description = "Lemoneko's onebot utility library for MiraiChan"
authors = [
    { name = "NingmengLemon", email = "60469383+NingmengLemon@users.noreply.github.com" },
]
dependencies = [
    "lemony_images",
    "lemony_utils",
    "lemony_network",
    "lemony_storage_helper",
    "melobot[onebot]>=3.5.1",
    "tenacity>=9.1.4",
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.3",
    "yarl>=1.23.0",
    "pydantic>=2.12.5",
]

requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "AGPL3" }

[tool.uv.sources]
lemony_images = { workspace = true }
lemony_utils = { workspace = true }
lemony_network = { workspace = true }
lemony_storage_helper = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-sqlalchemy>=0.3.0",
    "pytest-sqlalchemy-mock>=0.1.7",
    "jsonschema>=4.23",
]

[tool.setuptools.package-data]
"lemony_onebot_utils.onebot_ext" = ["resources/*.json"]

