[project]
name = "mbplugin_moelottery"
version = "1.0.0"
description = "今天你是一只什么属性的萌娘呢？"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "lemony_checkers",
    "lemony_settings",
    "lemony_utils",
    "melobot[onebot]>=3.5.1",
    "pydantic>=2.12.5",
]

[tool.setuptools]
packages = ["mbplugin_moelottery", "mbplugin_moelottery.resources"]

[tool.setuptools.package-dir]
mbplugin_moelottery = "."

[tool.setuptools.package-data]
"mbplugin_moelottery.resources" = ["*.json"]

[tool.uv.sources]
lemony_utils = { workspace = true }
lemony_checkers = { workspace = true }
lemony_settings = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
