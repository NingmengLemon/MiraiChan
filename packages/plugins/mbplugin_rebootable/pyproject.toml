[project]
name = "mbplugin_rebootable"
version = "0.1.0"
description = "A plugin for restarting the bot via command."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "lemony_utils",
    "lemony_checkers",
    "lemony_settings",
    "lemony_storage_helper",
    "melobot[onebot]>=3.5.1",
]


[tool.setuptools]
packages = ["mbplugin_rebootable"]

[tool.setuptools.package-dir]
mbplugin_rebootable = "."

[tool.uv.sources]
lemony_utils = { workspace = true }
lemony_checkers = { workspace = true }
lemony_settings = { workspace = true }
lemony_storage_helper = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
