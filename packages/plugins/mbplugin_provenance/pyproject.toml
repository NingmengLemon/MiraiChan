[project]
name = "mbplugin_provenance"
version = "0.1.0"
description = "Plugin for checking images for OpenAI provenance signals (C2PA, SynthID)."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.0",
    "lemony_checkers",
    "lemony_network",
    "lemony_onebot_utils",
    "lemony_settings",
    "lemony_storage_helper[files]",
    "lemony_utils",
    "melobot[onebot]>=3.5.1",
]

[tool.setuptools]
packages = ["mbplugin_provenance"]

[tool.setuptools.package-dir]
mbplugin_provenance = "."

[tool.uv.sources]
lemony_checkers = { workspace = true }
lemony_network = { workspace = true }
lemony_onebot_utils = { workspace = true }
lemony_settings = { workspace = true }
lemony_storage_helper = { workspace = true }
lemony_utils = { workspace = true }
