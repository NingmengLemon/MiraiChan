[project]
name = "mbplugin_recorder"
version = "0.1.0a0"
description = "A plugin for recording and managing historical chat messages."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles",
    "aiohttp>=3.13.3",
    "lemony_checkers",
    "lemony_storage_helper[sqlite,files]",
    "lemony_utils",
    "lemony_network",
    "melobot[onebot]>=3.5.1",
    "uuid-utils>=0.14.1",
]

[tool.setuptools]
packages = [
    "mbplugin_recorder",
    "mbplugin_recorder.adapters",
    "mbplugin_recorder.db",
]

[tool.setuptools.package-dir]
mbplugin_recorder = "."

[tool.uv.sources]
lemony_checkers = { workspace = true }
lemony_storage_helper = { workspace = true }
lemony_utils = { workspace = true }
lemony_network = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
