[project]
name = "mbplugin_checker_manager"
version = "1.0.2"
description = "lemony_checkers 共享库的聊天管理接口插件"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = ["lemony_checkers", "lemony_utils", "melobot[onebot]>=3.5.1"]

[tool.setuptools]
packages = ["mbplugin_checker_manager"]

[tool.setuptools.package-dir]
mbplugin_checker_manager = "."

[tool.setuptools.package-data]
mbplugin_checker_manager = ["py.typed"]

[tool.uv.sources]
lemony_utils = { workspace = true }
lemony_checkers = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
