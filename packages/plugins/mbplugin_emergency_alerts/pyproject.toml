[project]
name = "mbplugin_emergency_alerts"
version = "0.2.0"
description = "Push earthquake early warnings and reports to subscribed groups and users."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "lemony_utils",
    "aiohttp>=3.14.1",
    "json5>=0.15.0",
    "lemony_checkers",
    "lemony_network",
    "lemony_onebot_utils",
    "lemony_settings",
    "lemony_storage_helper[sqlite]",
    "melobot[onebot]>=3.5.1",
    "pydantic>=2.13.4",
    "uuid-utils>=0.14.1",
]

[tool.setuptools]
packages = [
    "mbplugin_emergency_alerts",
    "mbplugin_emergency_alerts.sources",
    "mbplugin_emergency_alerts.sources.sneb",
]

[tool.setuptools.package-dir]
mbplugin_emergency_alerts = "."

[tool.uv.sources]
lemony_utils = { workspace = true }
lemony_checkers = { workspace = true }
lemony_network = { workspace = true }
lemony_onebot_utils = { workspace = true }
lemony_settings = { workspace = true }
lemony_storage_helper = { workspace = true }
