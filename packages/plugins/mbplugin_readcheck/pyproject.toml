[project]
name = "mbplugin_readcheck"
version = "0.1.0"
description = "Read a link and fact-check a claim, both with citations (.read / .check)."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2",
    "lemony_llm_provider",
    "lemony_onebot_utils",
    "lemony_settings",
    "lemony_utils",
    "tzdata>=2025.2",
]

[tool.setuptools]
packages = ["mbplugin_readcheck"]

[tool.setuptools.package-dir]
mbplugin_readcheck = "."

[tool.uv.sources]
lemony_llm_provider = { workspace = true }
lemony_onebot_utils = { workspace = true }
lemony_settings = { workspace = true }
lemony_utils = { workspace = true }
