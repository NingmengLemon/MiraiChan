[project]
name = "mbplugin_deeeer"
version = "0.1.4"
description = "今天你🦌了吗？"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "lemony_checkers",
    "lemony_utils",
    "lemony_storage_helper[sqlite]",
    "melobot[onebot]>=3.5.1",
    "pillow>=13.0.0",
    "uuid-utils>=0.14.1",
]

[tool.setuptools]
packages = ["mbplugin_deeeer"]

[tool.setuptools.package-dir]
mbplugin_deeeer = "."

[tool.setuptools.package-data]
mbplugin_deeeer = ["py.typed", "resources/*"]

[tool.uv.sources]
lemony_checkers = { workspace = true }
lemony_utils = { workspace = true }
lemony_storage_helper = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
